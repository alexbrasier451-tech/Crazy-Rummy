<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0b0d0e">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src 'self' https://rms.metered.ca wss://rms.metered.ca; script-src 'self' https://unpkg.com; style-src 'unsafe-inline'; base-uri 'none'; object-src 'none'"
    >
    <title>Crazy Rummy WebRTC Test</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0b0d0e;
        color: #f7f2e9;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: max(1rem, env(safe-area-inset-top)) 1rem max(1rem, env(safe-area-inset-bottom));
      }
      main {
        width: min(100%, 34rem);
        padding: 1.25rem;
        border: 1px solid #424a43;
        border-radius: 1.25rem;
        background: #151817;
      }
      .eyebrow {
        margin: 0 0 0.35rem;
        color: #e2b542;
        font-size: 0.78rem;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      h1 { margin: 0; }
      .test-code {
        margin: 0.65rem 0 0;
        color: #e2b542;
        font-size: 1.4rem;
        font-weight: 900;
        letter-spacing: 0.16em;
      }
      #status, pre {
        margin: 1rem 0 0;
        padding: 1rem;
        border-radius: 0.8rem;
        background: #252b27;
      }
      #status[data-status="passed"] { color: #bdf5d8; }
      #status[data-status="failed"] { color: #ffd0cc; }
      pre {
        max-height: 55vh;
        overflow: auto;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Phase 0 - Metered WebRTC</p>
      <h1>Crazy Rummy connection test</h1>
      <p class="test-code">Code: <span id="test-code">------</span></p>
      <p id="status" data-status="starting" role="status" aria-live="polite">Starting...</p>
      <pre id="report" aria-label="Redacted connection report">No report yet.</pre>
    </main>
    <script src="./config.js"></script>
    <script src="https://unpkg.com/@metered-ca/realtime@1/dist/index.umd.js"></script>
    <script type="module" src="./probe.js"></script>
  </body>
</html>

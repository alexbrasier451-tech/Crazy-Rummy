<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0b0d0e">
    <title>Crazy Rummy Metered TURN Probe</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0b0d0e;
        color: #f7f2e9;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1rem;
      }

      main {
        width: min(100%, 34rem);
        padding: 1.25rem;
        border: 1px solid #424a43;
        border-radius: 1.25rem;
        background: #151817;
      }

      h1 {
        margin: 0;
      }

      #status,
      pre {
        margin: 1rem 0 0;
        padding: 1rem;
        border-radius: 0.8rem;
        background: #252b27;
      }

      #status[data-status="passed"] {
        color: #bdf5d8;
      }

      #status[data-status="failed"] {
        color: #ffd0cc;
      }

      pre {
        overflow: auto;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Metered TURN Probe</h1>
      <p id="status" data-status="starting" role="status" aria-live="polite">Starting…</p>
      <pre id="report" aria-label="Redacted probe report">No report yet.</pre>
    </main>
    <script src="https://unpkg.com/@metered-ca/realtime@1/dist/index.umd.js"></script>
    <script type="module" src="./metered-probe.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0b0d0e">
    <title>Crazy Rummy WebRTC/TURN Probe</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0b0d0e;
        color: #f7f2e9;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: max(1rem, env(safe-area-inset-top)) 1rem max(1rem, env(safe-area-inset-bottom));
      }

      main {
        width: min(100%, 34rem);
        padding: 1.25rem;
        border: 1px solid #424a43;
        border-radius: 1.25rem;
        background: #151817;
        box-shadow: 0 16px 42px rgb(0 0 0 / 42%);
      }

      .eyebrow {
        margin: 0 0 0.35rem;
        color: #e2b542;
        font-size: 0.78rem;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.55rem, 7vw, 2.4rem);
      }

      #status {
        margin: 1rem 0;
        padding: 0.8rem 1rem;
        border-radius: 0.8rem;
        background: #252b27;
        color: #bdb5a6;
        font-weight: 700;
      }

      #status[data-status="passed"] {
        border-color: #38c286;
        background: rgb(56 194 134 / 14%);
        color: #bdf5d8;
      }

      #status[data-status="failed"] {
        border-color: #ef6b61;
        background: rgb(239 107 97 / 14%);
        color: #ffd0cc;
      }

      pre {
        min-height: 12rem;
        overflow: auto;
        padding: 1rem;
        border: 1px solid #30372f;
        border-radius: 0.8rem;
        background: #101211;
        color: #d9d2c5;
        font-size: 0.78rem;
        line-height: 1.45;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Phase 0 network spike</p>
      <h1>WebRTC/TURN Probe</h1>
      <p id="status" data-status="starting" role="status" aria-live="polite">Starting…</p>
      <pre id="report" aria-label="Redacted probe report">No report yet.</pre>
    </main>
    <script type="module" src="./probe.js"></script>
  </body>
</html>
